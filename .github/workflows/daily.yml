name: daily record

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-record
  cancel-in-progress: false

env:
  HYPERODDS_API: https://api.usehyperodds.com

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Fetch new days and check held ones again (the last 14, every one on Sundays)
        run: node scripts/fetch.mjs --recheck "$([ "$(date -u +%u)" = 7 ] && echo all || echo 14)"
      - run: node scripts/verify.mjs
      - name: Publish the records
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh .github/publish.sh records records
      - run: node scripts/score.mjs
      - name: Publish the board
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh .github/publish.sh board board.json settlements.json
      - name: Compare with the API's board
        # Exit 3: the API scored other settlements (one settled in between), which explains the difference.
        run: node scripts/score.mjs --offline --compare "$HYPERODDS_API" || [ $? -eq 3 ]
