name: daily record

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/fetch.mjs
      - run: node scripts/verify.mjs
      - run: node scripts/score.mjs
      - name: Commit
        run: |
          git add records board.json settlements.json
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          days=$(git diff --cached --name-only --diff-filter=A -- 'records/*.jsonl' | sed 's|^records/||; s|\.jsonl$||' | paste -sd ' ' -)
          if [ -n "$days" ]; then message="record $days"; else message="settlements and board"; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$message"
          git push
